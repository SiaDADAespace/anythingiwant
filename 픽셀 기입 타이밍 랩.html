<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: oscilloscope-style timing lanes as the hero, circuit + live probe below, parameter rack at right */
:root{
  --bg:#eef1f4; --surface:#fbfcfd; --surface2:#f3f6f9; --ink:#131d27; --muted:#56646f; --faint:#8995a1;
  --line:#d4dbe2; --grid:#e4e9ee; --accent:#2350c2; --accent-ink:#ffffff;
  --g:#bf7300; --g2:#8a4bc6; --em:#0a8572; --d:#2160d6; --px:#cc2257; --cur:#4b7a0c;
  --good:#1c8549; --warn:#a96d07; --bad:#c13030;
  --good-bg:#e1f2e8; --warn-bg:#f9eed8; --bad-bg:#f9e3e3;
  --band-w:rgba(33,96,214,.075); --band-k:rgba(204,34,87,.07); --band-i:rgba(138,75,198,.08); --band-e:rgba(10,133,114,.07);
  --f-sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1116; --surface:#131a22; --surface2:#18212b; --ink:#e3e9ef; --muted:#9aa8b5; --faint:#6c7a88;
  --line:#25303c; --grid:#1c2630; --accent:#7ea4ff; --accent-ink:#0c1116;
  --g:#f2a93c; --g2:#bb90f3; --em:#38c9b0; --d:#72a0ff; --px:#ff6190; --cur:#a5d85c;
  --good:#52cb88; --warn:#f1b24c; --bad:#ff6e6e;
  --good-bg:rgba(82,203,136,.13); --warn-bg:rgba(241,178,76,.13); --bad-bg:rgba(255,110,110,.13);
  --band-w:rgba(114,160,255,.11); --band-k:rgba(255,97,144,.10); --band-i:rgba(187,144,243,.11); --band-e:rgba(56,201,176,.09);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1116; --surface:#131a22; --surface2:#18212b; --ink:#e3e9ef; --muted:#9aa8b5; --faint:#6c7a88;
  --line:#25303c; --grid:#1c2630; --accent:#7ea4ff; --accent-ink:#0c1116;
  --g:#f2a93c; --g2:#bb90f3; --em:#38c9b0; --d:#72a0ff; --px:#ff6190; --cur:#a5d85c;
  --good:#52cb88; --warn:#f1b24c; --bad:#ff6e6e;
  --good-bg:rgba(82,203,136,.13); --warn-bg:rgba(241,178,76,.13); --bad-bg:rgba(255,110,110,.13);
  --band-w:rgba(114,160,255,.11); --band-k:rgba(255,97,144,.10); --band-i:rgba(187,144,243,.11); --band-e:rgba(56,201,176,.09);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.55}
.wrap{max-width:1440px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.brand{min-width:0}
.brand h1{margin:0;font-size:clamp(20px,2.6vw,27px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.01em}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}

.seg button:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.kpi.bad .kv{color:var(--bad)} .kpi.warn .kv{color:var(--warn)}

.lab{display:grid;grid-template-columns:minmax(0,1fr) 344px;grid-template-areas:"scope ctl" "circ ctl";gap:16px;align-items:start}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.tb-l{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn svg{width:12px;height:12px;fill:currentColor}
.tread{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tread b{color:var(--ink);font-weight:600}
.cv-wrap{width:100%;overflow:hidden}
canvas#scope{display:block;width:100%;touch-action:none;cursor:ew-resize;border-radius:6px}
.hint{color:var(--faint);font-size:11.5px;margin:6px 2px 0}

.circ h2,.ctl h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.circ-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.circ-head span{font:500 11.5px var(--f-mono);color:var(--muted)}
.svgwrap{width:100%;overflow-x:auto}
.svgwrap svg{display:block;width:100%;min-width:300px;height:auto;max-height:400px}
.w{stroke:var(--ink);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round}
.w.dash{stroke-dasharray:3 3;stroke:var(--faint)}
.bus{stroke-width:2}
.chn{stroke:var(--ink);stroke-width:3;fill:none}
.gp{stroke:var(--ink);stroke-width:1.6;fill:none}
.bub{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.plate{stroke:var(--ink);stroke-width:2.4;fill:none}
.cap.dashc .plate{stroke:var(--faint)}
.dio{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.ray{stroke:var(--faint);stroke-width:1.2;fill:none}
.node{fill:var(--ink)}
.tl{font:600 10.5px var(--f-mono);fill:var(--muted)}
.rl{font:600 11px var(--f-mono);fill:var(--ink)}
.val{font:600 11px var(--f-mono);fill:var(--px)}
.val.i{fill:var(--cur)} .val.g{fill:var(--g)} .val.d{fill:var(--d)}
.tft .w,.tft .chn,.tft .gp,.tft .bub{transition:stroke .15s}
.tft.on .w,.tft.on .chn,.tft.on .gp,.tft.on .bub{stroke:var(--accent)}
.tft.on .chn{stroke-width:4}
.tft.on .tl{fill:var(--accent)}
.tft.ox .chn{stroke-dasharray:5 2}
#oled .dio{transition:fill .15s}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.phase{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.phase .pt{font-weight:700;font-size:14px;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.phase .pt i{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--accent);flex:none}
.phase p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.ro{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;margin:0}
.ro dt{color:var(--muted)} .ro dd{margin:0;text-align:right;font-weight:500}
.ro .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 6px;display:flex;flex-direction:column;gap:10px}
fieldset:first-of-type{border-top:0}
legend{font:700 11.5px var(--f-sans);color:var(--muted);letter-spacing:.06em;padding:0 0 2px;float:left;width:100%}
.c-row{display:flex;flex-direction:column;gap:3px}
.c-row label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink)}
.c-row output{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.c-row select{width:100%}
.c-chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.c-chk input{accent-color:var(--accent);margin-top:3px}
.ctl-head{display:flex;justify-content:space-between;align-items:center;padding:10px 0 4px;position:sticky;top:-6px;background:var(--surface);z-index:1}
.ctl-head button{font-size:12px;padding:5px 10px}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.notes-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.notes-h h2{margin:0;font-size:17px;letter-spacing:-.01em}
.notes-h p{margin:0;color:var(--muted);font-size:12.5px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;min-width:0}
.note h3{margin:0;font-size:14px;font-weight:700}
.eq{font-family:var(--f-mono);font-size:13px;background:var(--surface2);border-radius:7px;padding:8px 10px;overflow-x:auto;white-space:nowrap;color:var(--ink)}
.num{font-family:var(--f-mono);font-size:12px;color:var(--accent);line-height:1.55}
.note p{margin:0;color:var(--muted);font-size:12.8px;line-height:1.65;max-width:68ch}
sub,sup{font-size:.72em}

@media (max-width:1080px){
  .lab{grid-template-columns:minmax(0,1fr);grid-template-areas:"scope" "circ" "ctl"}
  .ctl{position:static;max-height:none}
}
@media (max-width:720px){
  .circ{grid-template-columns:minmax(0,1fr)}
  .kv{font-size:18px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>픽셀 기입 타이밍 랩</h1>
      <p>Storage capacitor write · kickback · Vth compensation · hold — TFT 모델 기반 과도응답</p>
    </div>
    <div class="hdr-ctl">
      <div class="seg" role="tablist" aria-label="화소 회로" id="modeTabs">
        <button role="tab" data-mode="lcd" id="tab-lcd">LCD 1T1C</button>
        <button role="tab" data-mode="o2" id="tab-o2">OLED 2T1C</button>
        <button role="tab" data-mode="o7" id="tab-o7">OLED 7T1C</button>
      </div>
      <label class="preset" for="preset">프리셋 <select id="preset"></select></label>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-live="polite"></section>

  <main class="lab">
    <section class="scope card" aria-label="타이밍 다이어그램">
      <div class="toolbar">
        <div class="tb-l">
          <div class="seg" aria-label="시간 범위">
            <button id="v-line" aria-pressed="true">1H 확대</button>
            <button id="v-frame" aria-pressed="false">프레임 전체</button>
          </div>
          <button class="btn" id="play" aria-pressed="false"><svg viewBox="0 0 12 12" id="playIcon"><path d="M2 1l9 5-9 5z"/></svg><span>재생</span></button>
        </div>
        <div class="tread" id="tread"></div>
      </div>
      <div class="cv-wrap"><canvas id="scope" tabindex="0" aria-label="타이밍 파형. 좌우 화살표로 커서 이동"></canvas></div>
      <p class="hint">파형 위를 드래그하거나 ← → 키로 커서를 옮기면 아래 회로의 ON 상태와 노드 전압이 따라 바뀝니다. Shift+화살표는 5배 이동.</p>
    </section>

    <section class="circ card" aria-label="화소 회로와 프로브">
      <div style="min-width:0">
        <div class="circ-head"><h2>화소 회로</h2><span id="circTag"></span></div>
        <div class="svgwrap" id="schem"></div>
      </div>
      <div class="side">
        <div class="phase" id="phase"></div>
        <dl class="ro" id="readout"></dl>
      </div>
    </section>

    <aside class="ctl card" id="ctl" aria-label="파라미터"></aside>
  </main>

  <div class="notes-h"><h2>해석 노트</h2><p>현재 파라미터 값을 대입한 해석식. 시뮬레이션은 RK4 과도해석이며 아래 식은 1차 근사입니다.</p></div>
  <section class="notes" id="notes"></section>
</div>

<script>
"use strict";
/* ───────── physical constants & device helpers ───────── */
const COX_LCD = 1.55e-8;   // F/cm²  SiNx 400 nm (a-Si / IGZO BCE)
const COX_OLED = 2.88e-8;  // F/cm²  SiO2 120 nm (LTPS)
const ELVSS = -2.5, NVT = 0.13;              // SS ≈ 0.3 V/dec
const B_SW = 80*COX_OLED*1.0, VTH_SW = 1.5;  // LTPS p-type switch (W/L=1)
const B_OX = 10*COX_OLED*1.5, VTH_OX = 0.8;  // IGZO n-type switch (W/L=1.5)

const softplus = x => x > 3 ? x : NVT*Math.log1p(Math.exp(x/NVT));
const smooth = x => { x = Math.min(1, Math.max(0, x)); return x*x*(3-2*x); };
const el = x => Math.max(0.03, x*(2-x));      // Elmore fraction along distributed RC line

function rc(t, init, edges, tau){            // first-order filtered step train → [v, dv/dt]
  let v = init, tgt = init, tl = null;
  for (const e of edges){
    if (e[0] > t) break;
    if (tl !== null) v = tgt + (v - tgt)*Math.exp(-(e[0]-tl)/tau);
    tgt = e[1]; tl = e[0];
  }
  if (tl === null) return [init, 0];
  const val = tgt + (v - tgt)*Math.exp(-(t - tl)/tau);
  return [val, (tgt - val)/tau];
}
function tftN(vg, va, vb, beta, vth, goff){  // current flowing INTO node b
  const hi = Math.max(va, vb), lo = Math.min(va, vb), vds = hi - lo;
  const vov = softplus(vg - lo - vth);
  let i = goff*vds + (vds < vov ? beta*(vov*vds - 0.5*vds*vds) : 0.5*beta*vov*vov);
  return va > vb ? i : -i;
}
function tftP(vg, va, vb, beta, vth, goff){  // vth = |Vth|
  const hi = Math.max(va, vb), lo = Math.min(va, vb), vds = hi - lo;
  const vov = softplus(hi - vg - vth);
  let i = goff*vds + (vds < vov ? beta*(vov*vds - 0.5*vds*vds) : 0.5*beta*vov*vov);
  return va > vb ? i : -i;
}
function integrate(f, X, tA, tB, N, rec){    // RK4, stiffness-adaptive substeps
  const dt = (tB - tA)/N; let t = tA; rec(t, X);
  for (let k = 0; k < N; k++){
    const stiff = tt => { const f0 = f(tt, X); return Math.abs((f(tt, X + 1e-3) - f0)/1e-3); };
    const g = Math.max(stiff(t), stiff(t + dt));
    const ns = Math.min(400, Math.max(1, Math.ceil(dt*g/1.0))), h = dt/ns;
    for (let s = 0; s < ns; s++){
      const k1 = f(t, X), k2 = f(t+h/2, X+h/2*k1), k3 = f(t+h/2, X+h/2*k2), k4 = f(t+h, X+h*k3);
      X += h/6*(k1 + 2*k2 + 2*k3 + k4); t += h;
    }
    t = tA + (k+1)*dt; rec(t, X);
  }
  return X;
}
function timing(p, smin = 60){
  const scanF = p.fr >= 60 ? p.fr : smin;
  const H = 1/(scanF*(p.rows + p.vbl)), Tf = 1/p.fr;
  const ton = p.setup*1e-6, toff = Math.max(ton + 0.1*H, H - p.oe*1e-6);
  return {scanF, H, Tf, ton, toff, skip: p.fr < 60};
}
function at(t, T, A){                         // linear interpolation on sorted T
  if (t <= T[0]) return A[0];
  const n = T.length; if (t >= T[n-1]) return A[n-1];
  let lo = 0, hi = n-1;
  while (hi - lo > 1){ const m = (lo+hi) >> 1; if (T[m] <= t) lo = m; else hi = m; }
  const u = (t - T[lo])/(T[hi] - T[lo] || 1);
  return A[lo] + (A[hi] - A[lo])*u;
}

/* ───────── formatting ───────── */
const fx = (v, d=2) => Number.isFinite(v) ? v.toFixed(d) : '—';
const sg = (v, d=2) => !Number.isFinite(v) ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d);
function si(v, u, d=2){
  if (!Number.isFinite(v)) return '—';
  const a = Math.abs(v);
  const P = [[1e-18,'a'],[1e-15,'f'],[1e-12,'p'],[1e-9,'n'],[1e-6,'µ'],[1e-3,'m'],[1,''],[1e3,'k'],[1e6,'M']];
  let s = P[0]; for (const q of P) if (a >= q[0]*0.9995) s = q;
  if (a === 0) s = [1, ''];
  const x = v/s[0], dd = Math.abs(x) >= 100 ? Math.max(0, d-2) : Math.abs(x) >= 10 ? Math.max(0, d-1) : d;
  return x.toFixed(dd) + ' ' + s[1] + u;
}
const pct = (v, d=1) => Number.isFinite(v) ? (v*100).toFixed(d) : '—';
const sgPct = (v, d=1) => Number.isFinite(v) ? (v >= 0 ? '+' : '−') + Math.abs(v*100).toFixed(d) : '—';
const exp10 = v => { const m = Math.pow(10, v); return si(m, 'A', 1); };
const grade = (x, g, w) => x <= g ? 'good' : x <= w ? 'warn' : 'bad';

/* ───────── parameter definitions ───────── */
const DEF = {
  fr:{l:'리프레시율', u:'Hz', min:1, max:240, step:1},
  rows:{l:'활성 행 수 N', u:'rows', min:480, max:4320, step:10},
  vbl:{l:'수직 블랭킹', u:'lines', min:0, max:200, step:2},

  const dE = [[-H, vrow], [0, vn], [H, vrow]];

  const SPO = t => rc(t, p.vgl, spoE, tg)[0], SNO = t => rc(t, p.vgl, snoE, tg)[0];
  const EM = t => rc(t, p.vgl, emE, tg)[0], N2 = t => rc(t, p.elvdd, n2E, Math.max(tg, td))[0];
  const D = t => rc(t, vrow, dE, td)[0];

  const icomp = (t, V) => {
    const d = D(t), sn = SN(t), g3 = G3(t);
    const vov2 = softplus(d - sn - VTH_SW);
    const vov3 = ox ? softplus(g3 - V - VTH_OX) : softplus(V - g3 - VTH_SW);
    const R = 1/(B_SW*Math.max(vov2, 1e-40)) + 1/((ox ? B_OX : B_SW)*Math.max(vov3, 1e-40));
    const a = d - V - vth; if (a <= 0) return 0;

  const rec = (t, X) => { const V = Vof(t, X), e = EM(t), d = D(t);
    r.t.push(t); r.s1.push(G4(t)); r.s2.push(SN(t)); r.s3.push(SNO(t)); r.em.push(e); r.d.push(d); r.dlo.push(d); r.dhi.push(d);

                     : tftP(g4off, vinit, V, B_SW, VTH_SW, goff) + tftP(g3off, vN3, V, B_SW, VTH_SW, goff);
        V += I/C*h;
      }
      t += dt; r.t.push(t); r.s1.push(g4off); r.s2.push(p.vgh); r.s3.push(p.vgl); r.em.push(p.vgl); r.d.push(vrow); r.dlo.push(vrow); r.dhi.push(vrow);
      r.v.push(V); r.n2.push(p.elvdd); r.io.push(Iol(V, p.vgl)); r.ic.push(0); r.i4.push(0);

    kick: r.vAft - r.vComp, kick3: r.vPreEm - r.vComp, kickEm: r.vAft - r.vPreEm,

    sV: r.I0 > 1e-12 ? a.I0/r.I0 - 1 : NaN, sM: r.I0 > 1e-12 ? b.I0/r.I0 - 1 : NaN,

    drift: r.I0 > 1e-12 ? r.Iend/r.I0 - 1 : NaN,

}

  probe(r, t, p){

      {l:'프레임 내 휘도 변화', v:sgPct(m.drift,2), u:'%', s:Number.isFinite(m.drift) ? grade(Math.abs(m.drift), 0.01, 0.03) : null, sub:`I ${si(r.I0,'A',0)} · Tf ${si(r.Tf,'s')}`},

      {h:'킥백', eq:'ΔV<sub>N1</sub> = + C<sub>gs,T2</sub> / C<sub>N1</sub> · (V<sub>GH</sub> − V<sub>GL</sub>)', num:`= ${p.cgs} fF / ${si(r.C,'F')} × ${fx(p.vgh - p.vgl,1)} V = ${sg(m.kickTh*1000,0)} mV (이상) · 시뮬레이션 ${sg(m.kick*1000,0)} mV`, t:'p-type 스위치는 OFF 전이가 상승 에지라 킥백이 양(+)으로 걸려 Vsg를 줄입니다. 평균 오프셋은 감마 튜닝으로 흡수되지만, 게이트 RC 차이에 따른 근단/원단 편차는 가로줄 무라로 남습니다.'},
      {h:'유지', eq:'ΔV<sub>N1</sub> ≈ I<sub>off</sub>·T<sub>f</sub> / C<sub>N1</sub>,  ΔI/I ≈ 2ΔV<sub>N1</sub>/V<sub>ov</sub>', num:`Ioff ${exp10(p.ioff)} · Tf ${si(r.Tf,'s')} → 휘도 ${sgPct(m.drift,2)} %`, t:'T2 누설 방향은 데이터 라인 평균 전압에 따라 달라집니다. 인접 행 데이터를 블랙/화이트로 바꿔 보면 같은 화소라도 화면 내용에 따라 유지 특성이 바뀌는 것을 볼 수 있습니다.'},
    ];
  },
},

      {h:'보상 원리', eq:'V<sub>N1</sub> → V<sub>data</sub> − |V<sub>th</sub>|  ⇒  I = (β/2)(ELVDD − V<sub>N1</sub> − |V<sub>th</sub>|)² = (β/2)(ELVDD − V<sub>data</sub>)²', num:`ELVDD − Vdata = ${fx(vov,2)} V → 이상 전류 ${si(m.Iid,'A')}  ·  시뮬레이션 ${si(r.I0,'A')}`, t:'기입 구간에 DT를 다이오드 연결해 자신의 Vth를 N1에 기록해 두고, 발광 구간에서 소스를 ELVDD로 바꾸면 Vth 항이 상쇄됩니다. 시뮬레이션 전류가 이상치와 다른 것은 보상 잔차와 킥백 때문이며, 이 평균 오프셋은 감마 튜닝에서 흡수됩니다. 남는 문제는 화소 간 산포입니다.'},
      {h:'보상 수렴: 지수가 아닌 쌍곡선', eq:'dV<sub>N1</sub>/dt = (β/2C)·u²  ⇒  u(t) = u<sub>0</sub> / (1 + κu<sub>0</sub>),  κ = βt/2C', num:`u0 = ${fx(m.u0,2)} V, κ = ${fx(m.kap,2)} /V → u = ${fx(m.uTh*1000,0)} mV (해석) · ${fx(m.resid*1000,0)} mV (시뮬레이션)`, t:'다이오드 연결 TFT는 목표에 가까워질수록 전류가 Vov²로 줄어 끝까지 수렴하지 못합니다. u0가 크면 잔차는 ≈ 2C/(βt)로 수렴해 Vth와 거의 무관해집니다(그래서 Vth 보상이 성립). 반대로 잔차가 β에 의존하므로 이동도가 큰 화소는 더 깊이 수렴하고, 이것이 이동도 산포를 일부 상쇄하는 효과로 나타납니다. 1H가 짧은 고해상도·고주사율일수록 잔차가 커집니다.'},
      {h:'킥백과 결합', eq:'ΔV<sub>N1</sub> = ±C<sub>gs,T3</sub>/C<sub>N1</sub>·ΔV<sub>scan</sub> + C<sub>DT,gs</sub>/C<sub>N1</sub>·(ELVDD − V<sub>N2</sub>)', num:`스캔 OFF ${sg(m.kick3*1000,0)} mV + EM ON ${sg(m.kickEm*1000,0)} mV = ${sg(m.kick*1000,0)} mV  ·  C_N1 ${si(r.C,'F')}`, t:'LTPS p-type T3는 OFF 시 게이트가 상승해 N1을 올리고, LTPO의 Oxide n-type T3는 게이트가 하강해 반대로 내립니다. 발광 시작 시 N2가 Vdata에서 ELVDD로 뛰면 DT의 게이트-소스 커패시턴스로 N1도 같이 올라가는데, 이 성분은 계조(Vdata)에 따라 달라 감마 곡선의 비선형 오차가 됩니다.'},
      {h:'유지 · LTPO', eq:'ΔV<sub>N1</sub> ≈ (I<sub>T3,off</sub> + I<sub>T4,off</sub>)·T<sub>f</sub> / C<sub>N1</sub>,  ΔI/I ≈ 2ΔV<sub>N1</sub>/V<sub>ov</sub>', num:`Ioff ${exp10(p.ioff)} · Tf ${si(r.Tf,'s')} → ΔV ≈ ${sg(-leakDV*1000,1)} mV · 휘도 ${sgPct(m.drift,2)} %`, t:'N1에 직접 붙은 T3·T4의 누설이 프레임 동안 게이트를 Vinit 쪽으로 끌어내려 p-type DT의 전류를 키웁니다. LTPS 스위치로는 저주파에서 휘도가 크게 흔들리므로, LTPO는 이 두 개만 Oxide로 바꿔 누설을 10⁻¹⁵ A 이하로 낮추고 120Hz 속도로 기입한 뒤 프레임을 건너뛰어 1Hz까지 내립니다. 실제 패널은 스킵 프레임 중 애노드 리셋으로 플리커를 추가 보정합니다.'},
    ];
  },
},
};

/* ───────── state & UI ───────── */
const $ = s => document.querySelector(s);
const state = {mode:'o7', view:'line', cursor:0.42, playing:false, p:{}, preset:{lcd:0, o2:0, o7:0}, res:null, geo:null};

function loadPreset(mode, idx){ state.p = JSON.parse(JSON.stringify(PRESETS[mode][idx].p)); state.preset[mode] = idx; }
function setMode(m){
  state.mode = m;
  document.querySelectorAll('#modeTabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m ? 'true' : 'false'));
  const sel = $('#preset'); sel.innerHTML = PRESETS[m].map((x, i) => `<option value="${i}">${x.n}</option>`).join('');
  sel.value = state.preset[m]; loadPreset(m, state.preset[m]);
  buildControls(); buildSchem(); recompute();
  try { localStorage.setItem('pwl-mode', m); } catch(e) {}
}
function keyOf(id){ return DEF[id].k || id; }
function buildControls(){
  const p = state.p;
  let h = `<div class="ctl-head"><h2>파라미터</h2><button class="btn" id="reset">프리셋 값으로</button></div>`;
  for (const [g, ids] of GROUPS[state.mode]){
    h += `<fieldset><legend>${g}</legend>`;
    for (const id of ids){
      const d = DEF[id], k = keyOf(id), v = p[k];
      if (d.type === 'sel') h += `<div class="c-row"><label for="c-${id}">${d.l}</label><select id="c-${id}" data-k="${k}">${d.o.map(o => `<option value="${o[0]}"${o[0] === v ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></div>`;
      else if (d.type === 'chk') h += `<label class="c-chk" for="c-${id}"><input type="checkbox" id="c-${id}" data-k="${k}"${v ? ' checked' : ''}><span>${d.l}</span></label>`;
      else h += `<div class="c-row"><label for="c-${id}"><span>${d.l}</span><output id="o-${id}">${fmtDef(d, v)}</output></label><input type="range" id="c-${id}" data-k="${k}" data-id="${id}" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}"></div>`;
    }
    h += `</fieldset>`;
  }
  $('#ctl').innerHTML = h;
  $('#reset').onclick = () => { loadPreset(state.mode, state.preset[state.mode]); buildControls(); buildSchem(); recompute(); };
}
function fmtDef(d, v){ if (d.f) return d.f(v); const dec = d.step >= 1 ? 0 : d.step >= 0.1 ? 1 : 2; return `${Number(v).toFixed(dec)}${d.u ? ' ' + d.u : ''}`; }
$('#ctl').addEventListener('input', e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  let v = el.type === 'checkbox' ? el.checked : el.tagName === 'SELECT' ? el.value : parseFloat(el.value);
  state.p[k] = v;
  if (el.dataset.id){ const o = $('#o-' + el.dataset.id); if (o) o.textContent = fmtDef(DEF[el.dataset.id], v); }
  if (k === 'tech'){ state.p.ioff = v === 'ltpo' ? -15.5 : -13; const r = $('#c-ioff'); if (r){ r.value = state.p.ioff; $('#o-ioff').textContent = fmtDef(DEF.ioff, state.p.ioff); } buildSchem(); }
  schedule();
});
let pend = false;
function schedule(){ if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; recompute(); }); }

function recompute(){
  const M = MODES[state.mode];
  try { state.res = M.run(state.p); } catch(err){ console.error(err); return; }
  renderKPIs(M.kpis(state.res, state.p));
  renderNotes(M.notes(state.res, state.p));
  draw(); probe();
}
function renderKPIs(list){
  const lab = {good:'양호', warn:'주의', bad:'부족'};
  $('#kpis').innerHTML = list.map(k => `<div class="kpi ${k.s || ''}"><div class="kl"><span>${k.l}</span>${k.s ? `<span class="pill ${k.s}">${lab[k.s]}</span>` : ''}</div><div class="kv">${k.v}<small>${k.u || ''}</small></div><div class="ks">${k.sub || ''}</div></div>`).join('');
}
function renderNotes(list){
  $('#notes').innerHTML = list.map(n => `<article class="note"><h3>${n.h}</h3><div class="eq">${n.eq}</div><div class="num">${n.num}</div><p>${n.t}</p></article>`).join('');
}
function buildSchem(){ $('#schem').innerHTML = MODES[state.mode].schem(state.p); $('#circTag').textContent = MODES[state.mode].tag; }

/* ───────── scope drawing ───────── */
function viewRange(r){ return state.view === 'line' ? [r.tA, r.tB] : [r.tA, r.Tf]; }
function fmtTime(t, view){ return view === 'line' ? `${(t*1e6).toFixed(3)} µs` : `${(t*1e3).toFixed(3)} ms`; }
function niceTicks(a, b, n){
  const span = b - a, step0 = span/n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0/mag;
  const step = (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10)*mag; const out = [];
  for (let v = Math.ceil(a/step)*step; v <= b + 1e-12; v += step) out.push(v);
  return out;
}
function draw(){
  const r = state.res; if (!r) return;
  const M = MODES[state.mode], cv = $('#scope');
  const W = Math.max(280, cv.parentElement.clientWidth);
  const cs = getComputedStyle(document.documentElement), C = n => cs.getPropertyValue('--' + n).trim();
  const lanes = M.lanes(r, state.p);
  const narrow = W < 600, laneH = narrow ? 56 : 64, top = 24, bot = 28, gl = narrow ? 84 : 122, gr = 10;
  const Hh = top + bot + lanes.length*laneH;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W*dpr); cv.height = Math.round(Hh*dpr); cv.style.height = Hh + 'px';
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, Hh);
  x.fillStyle = C('surface'); x.fillRect(0, 0, W, Hh);
  const [t0, t1] = viewRange(r), pw = W - gl - gr, X = t => gl + (t - t0)/(t1 - t0)*pw;
  state.geo = {gl, pw, t0, t1};
  const n1 = state.view === 'line' ? r.nw : r.t.length;
  const mono = '"IBM Plex Mono", ui-monospace, monospace', sans = '"IBM Plex Sans KR", system-ui, sans-serif';

  // phase bands
  for (const b of M.bands(r)){
    const a = Math.max(X(b.a), gl), e = Math.min(X(b.b), W - gr); if (e <= a) continue;
    if (b.c){ x.fillStyle = C(b.c); x.fillRect(a, top, Math.max(e - a, 1), Hh - top - bot); }
    if (b.l){ x.font = `600 11px ${sans}`; const tw = x.measureText(b.l).width;
      if (e - a > tw + 6){ x.fillStyle = C('muted'); x.textAlign = 'center'; x.fillText(b.l, (a + e)/2, 15); } }
  }
  // grid & axis
  x.lineWidth = 1; x.font = `500 10.5px ${mono}`; x.fillStyle = C('muted');
  if (state.view === 'line'){
    for (let k = -1; k <= 2; k++){
      const xx = Math.round(X(k*r.H)) + 0.5; x.strokeStyle = C('grid'); x.setLineDash(k === 0 ? [] : [2, 3]);
      x.beginPath(); x.moveTo(xx, top); x.lineTo(xx, Hh - bot); x.stroke();
      x.textAlign = 'center'; x.fillText(k === 0 ? '0' : (k < 0 ? '−' : '') + (Math.abs(k) === 1 ? '' : Math.abs(k)) + 'H', xx, Hh - bot + 16);
    }
    x.setLineDash([]); x.textAlign = 'left'; x.fillStyle = C('faint'); x.fillText(`1H = ${si(r.H,'s')}`, 8, Hh - bot + 16);
  } else {
    for (const tv of niceTicks(0, r.Tf, narrow ? 4 : 8)){
      const xx = Math.round(X(tv)) + 0.5; x.strokeStyle = C('grid'); x.setLineDash([2, 3]);
      x.beginPath(); x.moveTo(xx, top); x.lineTo(xx, Hh - bot); x.stroke();
      x.textAlign = 'center'; x.fillText(si(tv,'s',1).replace(' ', ''), xx, Hh - bot + 16);
    }
    x.setLineDash([]); x.textAlign = 'left'; x.fillStyle = C('faint'); x.fillText(`Tf = ${si(r.Tf,'s')}`, 8, Hh - bot + 16);
  }

  const tc = t0 + state.cursor*(t1 - t0), xc = X(tc);
  const tags = [];
  lanes.forEach((L, li) => {
    const y0 = top + li*laneH, y1 = y0 + laneH, pad = 9;
    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < n1; i++){
      const v = L.a[i]; if (v < mn) mn = v; if (v > mx) mx = v;
      if (L.lo){ if (L.lo[i] < mn) mn = L.lo[i]; if (L.hi[i] > mx) mx = L.hi[i]; }
    }
    const dmn = mn, dmx = mx;
    (L.refs || []).forEach(rf => { mn = Math.min(mn, rf.v); mx = Math.max(mx, rf.v); });
    if (mx - mn < 1e-12){ const c = L.u === 'A' ? Math.max(Math.abs(mx), 1e-12) : 0.5; mn -= c; mx += c; }
    const sp = (mx - mn)*0.1; mn -= sp; mx += sp;
    const Y = v => y1 - pad - (v - mn)/(mx - mn)*(laneH - 2*pad);
    // separator
    x.strokeStyle = C('line'); x.beginPath(); x.moveTo(0, y1 + 0.5); x.lineTo(W, y1 + 0.5); x.stroke();
    if (li === 0){ x.beginPath(); x.moveTo(0, y0 + 0.5); x.lineTo(W, y0 + 0.5); x.stroke(); }
    // labels
    x.textAlign = 'left'; x.fillStyle = C(L.c); x.font = `600 12px ${mono}`; x.fillText(L.name, 8, y0 + 18);
    if (!narrow){ x.fillStyle = C('faint'); x.font = `400 10.5px ${sans}`; x.fillText(L.sub, 8, y0 + 33); }
    x.fillStyle = C('faint'); x.font = `500 10px ${mono}`; x.textAlign = 'right';
    const fv = v => L.u === 'A' ? si(v,'A',1) : fx(v,2);
    x.fillText(fv(dmx), gl - 6, Math.max(y0 + 12, Y(dmx) + 3));
    if (dmx - dmn > 1e-12) x.fillText(fv(dmn), gl - 6, Math.min(y1 - 3, Y(dmn) + 3));
    // refs
    (L.refs || []).forEach(rf => {
      x.strokeStyle = C(rf.c || 'faint'); x.globalAlpha = 0.75; x.setLineDash([4, 4]);
      x.beginPath(); x.moveTo(gl, Y(rf.v)); x.lineTo(W - gr, Y(rf.v)); x.stroke(); x.setLineDash([]); x.globalAlpha = 1;
      x.fillStyle = C(rf.c || 'faint'); x.font = `500 10px ${mono}`; x.textAlign = 'right'; x.fillText(rf.l, W - gr - 2, Y(rf.v) - 3);
    });
    // lo/hi band
    x.save(); x.beginPath(); x.rect(gl, y0, pw, laneH); x.clip();
    if (L.lo){
      x.fillStyle = C(L.c); x.globalAlpha = 0.14; x.beginPath();
      for (let i = 0; i < n1; i++){ const xx = X(r.t[i]); i ? x.lineTo(xx, Y(L.hi[i])) : x.moveTo(xx, Y(L.hi[i])); }
      for (let i = n1 - 1; i >= 0; i--) x.lineTo(X(r.t[i]), Y(L.lo[i]));
      x.closePath(); x.fill(); x.globalAlpha = 1;
    }
    // zero line for current
    if (L.u === 'A' && mn < 0 && mx > 0){ x.strokeStyle = C('grid'); x.beginPath(); x.moveTo(gl, Y(0)); x.lineTo(W - gr, Y(0)); x.stroke(); }
    // trace
    x.strokeStyle = C(L.c); x.lineWidth = 1.7; x.lineJoin = 'round'; x.beginPath();
    for (let i = 0; i < n1; i++){ const xx = X(r.t[i]), yy = Y(L.a[i]); i ? x.lineTo(xx, yy) : x.moveTo(xx, yy); }
    x.stroke(); x.lineWidth = 1;
    // annotations
    if (state.view === 'line' && L.annot){
      for (const an of L.annot){
        const xa = X(an.ta), xb = X(an.tb), ya = Y(an.v1), yb = Y(an.v2);
        x.strokeStyle = C('ink'); x.globalAlpha = 0.55; x.setLineDash([2, 3]);
        x.beginPath(); x.moveTo(xa, ya); x.lineTo(xb, ya); x.stroke(); x.setLineDash([]); x.globalAlpha = 1;
        x.strokeStyle = C('ink'); x.beginPath(); x.moveTo(xb, ya); x.lineTo(xb, yb); x.moveTo(xb - 3, ya); x.lineTo(xb + 3, ya); x.moveTo(xb - 3, yb); x.lineTo(xb + 3, yb); x.stroke();
        x.font = `600 10.5px ${mono}`; const tw = x.measureText(an.text).width;
        const tx = xb + 6 + tw > W - gr ? xb - 6 - tw : xb + 6, ty = (ya + yb)/2 + 4;
        x.fillStyle = C('surface'); x.globalAlpha = 0.85; x.fillRect(tx - 2, ty - 11, tw + 4, 14); x.globalAlpha = 1;
        x.fillStyle = C('ink'); x.textAlign = 'left'; x.fillText(an.text, tx, ty);
      }
    }
    x.restore();
    // cursor dot + tag
    const vc = at(tc, r.t, L.a), yc = Y(vc);
    tags.push({y: yc, y0, y1, c: C(L.c), s: L.u === 'A' ? si(vc,'A',1) : fx(vc,3) + ' V'});
  });
  // cursor
  x.strokeStyle = C('ink'); x.globalAlpha = 0.8; x.beginPath(); x.moveTo(Math.round(xc) + 0.5, top); x.lineTo(Math.round(xc) + 0.5, Hh - bot); x.stroke(); x.globalAlpha = 1;
  x.font = `600 10.5px ${mono}`;
  for (const g of tags){
    x.fillStyle = g.c; x.beginPath(); x.arc(xc, g.y, 3.2, 0, Math.PI*2); x.fill();
    const tw = x.measureText(g.s).width, right = xc + 8 + tw + 6 < W - gr, tx = right ? xc + 8 : xc - 8 - tw - 6;
    const ty = Math.min(g.y1 - 4, Math.max(g.y0 + 14, g.y - 7));
    x.fillStyle = C('surface'); x.strokeStyle = g.c; x.globalAlpha = 0.95;
    x.fillRect(tx, ty - 11, tw + 6, 15); x.globalAlpha = 1; x.strokeRect(tx + 0.5, ty - 10.5, tw + 5, 14);
    x.fillStyle = g.c; x.textAlign = 'left'; x.fillText(g.s, tx + 3, ty);
  }
  $('#tread').innerHTML = `t = <b>${fmtTime(tc, state.view)}</b>` + (state.view === 'line' ? ` · ${(tc/r.H).toFixed(2)} H` : '');
}

/* ───────── probe (circuit + readout) ───────── */
function probe(){
  const r = state.res; if (!r || !state.geo) return;
  const {t0, t1} = state.geo, t = t0 + state.cursor*(t1 - t0);
  const pr = MODES[state.mode].probe(r, t, state.p);
  const svg = $('#schem');
  for (const [id, on] of Object.entries(pr.on)){ const g = svg.querySelector('#' + id); if (g) g.classList.toggle('on', !!on); }
  for (const [id, s] of Object.entries(pr.sv)){ const e = svg.querySelector('#' + id); if (e) e.textContent = s; }
  const od = svg.querySelector('#oled .dio');
  if (od){ const k = Math.max(0, Math.min(1, pr.oled || 0)); od.style.fill = k > 0.01 ? 'var(--g)' : ''; od.style.fillOpacity = k > 0.01 ? String(0.15 + 0.85*k) : ''; }
  $('#phase').innerHTML = `<div class="pt"><i style="background:var(--${pr.ph[2]})"></i>${pr.ph[0]}</div><p>${pr.ph[1]}</p>`;
  $('#readout').innerHTML = pr.ro.map(([k, v, c]) => `<dt>${c ? `<span class="sw" style="background:var(--${c})"></span>` : ''}${k}</dt><dd>${v}</dd>`).join('');
}

/* ───────── interaction ───────── */
const cv = $('#scope');
function setCursorFromX(clientX){
  const g = state.geo; if (!g) return;
  const rect = cv.getBoundingClientRect();
  state.cursor = Math.max(0, Math.min(1, (clientX - rect.left - g.gl)/g.pw));
  requestDraw();
}
let drawPend = false;
function requestDraw(){ if (drawPend) return; drawPend = true; requestAnimationFrame(() => { drawPend = false; draw(); probe(); }); }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); stopPlay(); setCursorFromX(e.clientX); });
cv.addEventListener('pointermove', e => { if (cv.hasPointerCapture(e.pointerId)) setCursorFromX(e.clientX); });
cv.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault(); stopPlay();
  const d = (e.shiftKey ? 0.025 : 0.005)*(e.key === 'ArrowLeft' ? -1 : 1);
  state.cursor = Math.max(0, Math.min(1, state.cursor + d)); requestDraw();
});
document.querySelectorAll('#modeTabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#preset').addEventListener('change', e => { loadPreset(state.mode, +e.target.value); buildControls(); buildSchem(); recompute(); });
function setView(v){
  state.view = v; $('#v-line').setAttribute('aria-pressed', v === 'line'); $('#v-frame').setAttribute('aria-pressed', v === 'frame');
  state.cursor = v === 'line' ? 0.42 : 0.3; requestDraw();
}
$('#v-line').onclick = () => setView('line'); $('#v-frame').onclick = () => setView('frame');
let lastTs = 0;
function tick(ts){
  if (!state.playing) return;
  const dt = lastTs ? (ts - lastTs)/1000 : 0; lastTs = ts;
  state.cursor += dt/6; if (state.cursor > 1) state.cursor = 0;
  draw(); probe(); requestAnimationFrame(tick);
}
function stopPlay(){ if (!state.playing) return; state.playing = false; updPlay(); }
function updPlay(){
  const b = $('#play'); b.setAttribute('aria-pressed', state.playing);
  b.querySelector('span').textContent = state.playing ? '정지' : '재생';
  $('#playIcon').innerHTML = state.playing ? '<path d="M2 1h3v10H2zM7 1h3v10H7z"/>' : '<path d="M2 1l9 5-9 5z"/>';
}
$('#play').onclick = () => { state.playing = !state.playing; updPlay(); if (state.playing){ lastTs = 0; requestAnimationFrame(tick); } };

new ResizeObserver(() => requestDraw()).observe(cv.parentElement);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', requestDraw);
new MutationObserver(requestDraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
